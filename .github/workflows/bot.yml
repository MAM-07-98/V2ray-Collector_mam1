name: "CONFIG COLLECTOR"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          
      - name: Execute PHP script
        run: php bot.php
      
      - name: Keep only last 50 configs and merge all
        run: |
          mkdir -p Config
          > Config/all_configs.txt
          
          for file in Config/*.txt; do
            if [ -f "$file" ] && [ "$(basename "$file")" != "all_configs.txt" ]; then
              tail -n 50 "$file" > "$file.tmp" && mv "$file.tmp" "$file"
              cat "$file" >> Config/all_configs.txt
              echo "" >> Config/all_configs.txt
            fi
          done
          
          echo "✅ Merged all configs into Config/all_configs.txt"
          echo "📊 Total lines: $(wc -l < Config/all_configs.txt)"
      
      - name: Push changes
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git add -A
          git commit -m "Update - $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')" || echo "No changes"
          git push https://${{ secrets.PUSH_BOT }}@github.com/MAM-07-98/V2ray-Collector_mam1.git HEAD:main
